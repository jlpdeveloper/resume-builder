schema: resume/v1
kind: base
id: staff-engineer

profile: ../profile.yml
template: ../templates/standard.yml
pageLimit: 2
sections:
  - summary
  - impact
  - skills
  - experience
  - projects
  - education
  - certifications

# These are the shared defaults; a resume can select a narrower set.
employment:
  - id: northstar
    name: Northstar Analytics
    location: Seattle, WA
    link: https://northstar.example/
    roles:
      - id: staff-platform
        title: Staff Platform Engineer
        start: "2022-01"
        accomplishments:
          - Reduced deployment failures by 62% through progressive delivery and automated rollback.
          - Established service ownership and SLO reviews for 14 production teams.
  - id: evergreen-systems
    name: Evergreen Systems
    location: Portland, OR
    link: https://evergreen.example/
    roles:
      - id: systems-engineer
        title: Software Engineer
        start: "2016-06"
        end: "2019-03"
        accomplishments:
          - Automated release checks and reduced manual deployment steps from 12 to 4.

skills:
  - id: platform
    name: Platform Engineering
    skills:
      - Go
      - Kubernetes
      - Terraform
  - id: leadership
    name: Technical Leadership
    skills:
      - Technical roadmaps
      - Mentoring

projects:
  - id: delivery-platform
  - id: tracing-toolkit

education:
  - id: bs-computer-science

certifications:
  - id: cka
  - id: aws-architect